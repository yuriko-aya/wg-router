# Example nginx site for WG Router.
# Replace wg.example.com and paths to match your server.

upstream wg_router {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name wg.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wg.example.com;

    ssl_certificate     /etc/letsencrypt/live/wg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wg.example.com/privkey.pem;

    client_max_body_size 4m;

    location / {
        proxy_pass http://wg_router;
        proxy_http_version 1.1;

        # Required so Auth.js builds https:// redirect_uri values
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
